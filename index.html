<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Stream Gage Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    pre { background: #f4f4f4; padding: 20px; border-radius: 8px; }
    table {
      border-collapse: collapse;
    }
    table th,
    table td {
      border: 1px solid #ddd; /* light gray gridlines */
      padding: 6px 8px;
    }  
    table th {
      background: #f8f8f8; /* subtle header background */
      text-align: left;
      padding-left: 6px;
    }
  </style>
</head>
<body>
  <h1>Stream Gage Dashboard</h1>
  <p id="updated">Updated: loading...</p>
  <div style="text-align: right; margin-bottom: 8px;">
    <a href="allstations.html">View All Stations Map</a>
  </div>
  <table id="gage-table" style="width:100%; border-collapse: collapse; margin-top: 20px;">
    <thead>
      <tr>
        <th>Station Name</th>
        <th>Station ID</th>
        <th>Gage Height (ft)</th>
        <th>3-Hr Trend</th>
        <th>24‑Hr Trend</th>
        <th>Kona 1 Max</th>
        <th>Kona 2 Max</th>
        <th>Minor Flood</th>
        <th>Major Flood</th>
        <th>Status</th>
        <th>Last Updated (HST)</th>
        <th>Map</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>


<script>
// Determine island from SiteName
function getIsland(name) {
  name = name.toLowerCase();
  if (name.includes("molokai")) return "Molokai";
  if (name.includes("maui")) return "Maui";
  if (name.includes("hawaii")) return "Hawaii";
  if (name.includes("oahu")) return "Oahu";
  if (name.includes("kauai")) return "Kauai";
  return "Other";
}

// Convert UTC timestamp → Hawaii Standard Time (UTC-10)
function toHawaiiTime(utcString) {
  const utcDate = new Date(utcString);

  return utcDate.toLocaleString("en-US", {
    timeZone: "Pacific/Honolulu",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

// Compute gage height trend over last 3 hours
function getTrendArrow(trend) {
  switch (trend) {
    case "Rising":  return "↑";
    case "Falling": return "↓";
    case "Steady":  return "--";
    default:        return "•"; // for N/A
  }
}
  
// Generate sparkline chart
function makeSparkline(values, width = 100, height = 20) {
  if (!values || values.length === 0) return "";

  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;

  return values
    .map((v, i) => {
      const x = (i / (values.length - 1)) * width;
      const y = height - ((v - min) / range) * height;
      return `${x},${y}`;
    })
    .join(" ");
}
  
// Compute status from value + thresholds
function computeStatus(value, minor, major) {
  if (major !== null && value >= major) return "Major Flood";
  if (minor !== null && value >= minor) return "Minor Flood";
  if (minor !== null && value >= minor * 0.9) return "Near";
  if (minor === null && major === null) return "No Threshold";
  return "Normal";
}

// Map status → emoji + class
function getStatusInfo(status) {
  switch (status) {
    case "Normal":       return { icon: "🟢", cls: "" };
    case "Near":         return { icon: "🟡", cls: "" };
    case "Minor Flood":  return { icon: "🟠", cls: "" };
    case "Major Flood":  return { icon: "🔴", cls: "" };
    case "No Threshold": return { icon: "⚫", cls: "" };
    case "Out of Date": return { icon: "⚪", cls: "" };
    default:             return { icon: "⚫", cls: "" };
  }
}

// Load GitHub workflow timestamp
let buildTimeHST = "loading...";

fetch("buildinfo.json?cache=" + Date.now())
  .then(r => r.json())
  .then(info => {
    buildTimeHST = toHawaiiTime(info.buildTime);
    document.getElementById("updated").textContent =
      "Updated (HST): " + buildTimeHST;
  })
  .catch(err => {
    document.getElementById("updated").textContent =
      "Updated: error loading timestamp";
  });

let historyData = {};

Promise.all([
  fetch("history24.json?cache=" + Date.now()).then(r => r.json()),
  fetch("latest_with_trend.json?cache=" + Date.now()).then(r => r.json())
])
.then(([history24, data]) => {

  historyData = history24;   // store 24‑hour history

  const now = Date.now();
  const twentyFourHours = 24 * 60 * 60 * 1000;

  const tbody = document.querySelector("#gage-table tbody");
  tbody.innerHTML = "";

  // Group by island
  const groups = {};
  data.forEach(site => {
    const island = getIsland(site.SiteName);
    if (!groups[island]) groups[island] = [];
    groups[island].push(site);
  });

  // Render each island group
  Object.keys(groups).forEach(island => {
    const headerRow = document.createElement("tr");
    headerRow.innerHTML = `
      <td colspan="12" style="
        background:#004578;
        color:white;
        font-weight:bold;
        font-size:18px;
      ">${island}</td>
    `;
    tbody.appendChild(headerRow);

    groups[island].forEach(site => {
      const siteTime = new Date(site.Timestamp).getTime();
      const age = now - siteTime;
  
      let status;
      let displayValue = site.Value;
  
      if (age > twentyFourHours) {
        status = "Out of Date";
        displayValue = "n/a";
      } else {
        status = computeStatus(site.Value, site.MinorFlood, site.MajorFlood);
      }
  
      const statusInfo = getStatusInfo(status);
  
      // --- 24‑HOUR SPARKLINE DATA (fixed Y-axis 0..15 ft) ---
      // --- 24‑HOUR SPARKLINE DATA (autoscale to series only; Kona overlay) ---
      const toNum = v => v == null ? null : Number(v);
      const series = (historyData[site.SiteCode] || [])
        .map(v => toNum(v.Value))
        .filter(v => typeof v === 'number' && !Number.isNaN(v));
      
      const width = 100;
      const height = 20;
      
      // Local autoscale from series (with padding), independent of Kona values
      let AXIS_MIN, AXIS_MAX;
      if (series.length >= 2) {
        const sMin = Math.min(...series);
        const sMax = Math.max(...series);
        const sRange = sMax - sMin;
        const pad = Math.max(0.2, sRange * 0.15); // >= 0.2 ft or 15% of range
      
        AXIS_MIN = sMin - pad;
        AXIS_MAX = sMax + pad;
      
        // Guard against degenerate axis
        if (AXIS_MAX <= AXIS_MIN) AXIS_MAX = AXIS_MIN + 1;
      } else {
        // Fallback axis around current value ±1 ft
        const cur = toNum(site.Value);
        const base = (cur != null && !Number.isNaN(cur)) ? cur : 0;
        AXIS_MIN = base - 1;
        AXIS_MAX = base + 1;
      }
      
      function scaleY(v) {
        const t = (Number(v) - AXIS_MIN) / (AXIS_MAX - AXIS_MIN);
        const y = height - (t * height);
        return Math.max(0, Math.min(height, y)); // clamp inside SVG
      }
      
      // Build sparkline polyline points
      let points = "";
      if (series.length > 1) {
        points = series.map((v, i) => {
          const x = (i / (series.length - 1)) * width;
          const y = scaleY(v);
          return `${x},${y}`;
        }).join(" ");
      }
      
      // Kona 1 overlay with in/out-of-range detection
      const K1 = toNum(site.Kona1Max);
      let yK1 = null, k1OutTop = false, k1OutBottom = false;
      if (K1 != null && !Number.isNaN(K1)) {
        if (K1 > AXIS_MAX) k1OutTop = true;
        else if (K1 < AXIS_MIN) k1OutBottom = true;
        else yK1 = scaleY(K1);

  
      // ✅ Build the row HTML inside a template string
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${site.SiteName}</td>
        <td>${site.SiteCode}</td>
        <td>${displayValue}</td>
        <td style="white-space: pre;">${site.Trend}</td>
        <td>
          <svg width="${width}" height="${height}">
            ${points ? `
              <polyline fill="none" stroke="#0074d9" stroke-width="2"
                        points="${points}"></polyline>
            ` : ``}
        
            <!-- Kona 1 Max dashed line when inside range -->
            ${yK1 !== null ? `
              <line x1="0" y1="${yK1}" x2="${width}" y2="${yK1}"
                    stroke="red" stroke-width="1" stroke-dasharray="3,2">
                <title>Kona 1 Max: ${site.Kona1Max} ft</title>
              </line>
            ` : ``}
        
            <!-- Small edge marker when Kona 1 is outside axis -->
            ${k1OutTop ? `
              <polygon points="${width-10},2 ${width-2},2 ${width-6},8"
                       fill="red">
                <title>Kona 1 Max above visible range (${site.Kona1Max} ft)</title>
              </polygon>
            ` : ``}
            ${k1OutBottom ? `
              <polygon points="${width-10},${height-2} ${width-2},${height-2} ${width-6},${height-8}"
                       fill="red">
                <title>Kona 1 Max below visible range (${site.Kona1Max} ft)</title>
              </polygon>
            ` : ``}
          </svg>
        </td>

        <!-- New static columns -->
        <td>${site.Kona1Max ?? ""}</td>
        <td>${site.Kona2Max ?? ""}</td>
  
        <td>${site.MinorFlood ?? ""}</td>
        <td>${site.MajorFlood ?? ""}</td>
        <td>${statusInfo.icon} ${status}</td>
        <td>${toHawaiiTime(site.Timestamp)}</td>
        <td>
          map.html?lat=${site.Latitude}&lon=${site.Longitude}&name=${encodeURIComponent(site.SiteName)}View</a>
        </td>
      `;
      tbody.appendChild(row);      
    });
  });

})
.catch(err => {
  document.getElementById("updated").textContent =
    "Error loading data: " + err;
});
</script>
</body>
</html>
