<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Stream Gage Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    pre { background: #f4f4f4; padding: 20px; border-radius: 8px; }
    table {
      border-collapse: collapse;
    }
    table th,
    table td {
      border: 1px solid #ddd; /* light gray gridlines */
      padding: 6px 8px;
    }  
    table th {
      background: #f8f8f8; /* subtle header background */
      text-align: left;
      padding-left: 6px;
    }
  </style>
</head>
<body>
  <h1>Stream Gage Dashboard</h1>
  <p id="updated">Updated: loading...</p>
  <div style="text-align: right; margin-bottom: 8px;">
    <a href="allstations.html">View All Stations Map</a>
  </div>
  <table id="gage-table" style="width:100%; border-collapse: collapse; margin-top: 20px;">
    <thead>
      <tr>
        <th>Station Name</th>
        <th>Station ID</th>
        <th>Gage Height (ft)</th>
        <th>3-Hr Trend</th>
        <th>24‑Hr Trend</th>
        <th>Kona 1 Max</th>
        <th>Kona 2 Max</th>
        <th>Minor Flood</th>
        <th>Major Flood</th>
        <th>Status</th>
        <th>Last Updated (HST)</th>
        <th>Map</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>


<script>
// Determine island from SiteName
function getIsland(name) {
  name = name.toLowerCase();
  if (name.includes("molokai")) return "Molokai";
  if (name.includes("maui")) return "Maui";
  if (name.includes("hawaii")) return "Hawaii";
  if (name.includes("oahu")) return "Oahu";
  if (name.includes("kauai")) return "Kauai";
  return "Other";
}

// Convert UTC timestamp → Hawaii Standard Time (UTC-10)
function toHawaiiTime(utcString) {
  const utcDate = new Date(utcString);

  return utcDate.toLocaleString("en-US", {
    timeZone: "Pacific/Honolulu",
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

// Compute gage height trend over last 3 hours
function getTrendArrow(trend) {
  switch (trend) {
    case "Rising":  return "↑";
    case "Falling": return "↓";
    case "Steady":  return "--";
    default:        return "•"; // for N/A
  }
}
  
// Generate sparkline chart
function makeSparkline(values, width = 100, height = 20) {
  if (!values || values.length === 0) return "";

  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;

  return values
    .map((v, i) => {
      const x = (i / (values.length - 1)) * width;
      const y = height - ((v - min) / range) * height;
      return `${x},${y}`;
    })
    .join(" ");
}
  
// Compute status from value + thresholds
function computeStatus(value, minor, major) {
  if (major !== null && value >= major) return "Major Flood";
  if (minor !== null && value >= minor) return "Minor Flood";
  if (minor !== null && value >= minor * 0.9) return "Near";
  if (minor === null && major === null) return "No Threshold";
  return "Normal";
}

// Map status → emoji + class
function getStatusInfo(status) {
  switch (status) {
    case "Normal":       return { icon: "🟢", cls: "" };
    case "Near":         return { icon: "🟡", cls: "" };
    case "Minor Flood":  return { icon: "🟠", cls: "" };
    case "Major Flood":  return { icon: "🔴", cls: "" };
    case "No Threshold": return { icon: "⚫", cls: "" };
    case "Out of Date": return { icon: "⚪", cls: "" };
    default:             return { icon: "⚫", cls: "" };
  }
}

// Load GitHub workflow timestamp
let buildTimeHST = "loading...";

fetch("buildinfo.json?cache=" + Date.now())
  .then(r => r.json())
  .then(info => {
    buildTimeHST = toHawaiiTime(info.buildTime);
    document.getElementById("updated").textContent =
      "Updated (HST): " + buildTimeHST;
  })
  .catch(err => {
    document.getElementById("updated").textContent =
      "Updated: error loading timestamp";
  });

let historyData = {};

Promise.all([
  fetch("history24.json?cache=" + Date.now()).then(r => r.json()),
  fetch("latest_with_trend.json?cache=" + Date.now()).then(r => r.json())
])
.then(([history24, data]) => {

  historyData = history24;   // store 24‑hour history

  const now = Date.now();
  const twentyFourHours = 24 * 60 * 60 * 1000;

  const tbody = document.querySelector("#gage-table tbody");
  tbody.innerHTML = "";

  // Group by island
  const groups = {};
  data.forEach(site => {
    const island = getIsland(site.SiteName);
    if (!groups[island]) groups[island] = [];
    groups[island].push(site);
  });

  // Render each island group
  Object.keys(groups).forEach(island => {
    const headerRow = document.createElement("tr");
    headerRow.innerHTML = `
      <td colspan="12" style="
        background:#004578;
        color:white;
        font-weight:bold;
        font-size:18px;
      ">${island}</td>
    `;
    tbody.appendChild(headerRow);

    groups[island].forEach(site => {
      const siteTime = new Date(site.Timestamp).getTime();
      const age = now - siteTime;
  
      let status;
      let displayValue = site.Value;
  
      if (age > twentyFourHours) {
        status = "Out of Date";
        displayValue = "n/a";
      } else {
        status = computeStatus(site.Value, site.MinorFlood, site.MajorFlood);
      }
  
      const statusInfo = getStatusInfo(status);
  
      // --- 24‑HOUR SPARKLINE DATA: fixed Y-axis (0..15 ft) + axis labels ---
      const toNum = v => v == null ? null : Number(v);
      const series = (historyData[site.SiteCode] || [])
        .map(v => toNum(v.Value))
        .filter(v => typeof v === 'number' && !Number.isNaN(v));
      
      // Chart sizing
      const width = 120;   // a bit wider to fit labels comfortably
      const height = 24;   // slightly taller than 20 for readability
      
      // Fixed axis domain in FEET
      const AXIS_MIN = 0;
      const AXIS_MAX = 15;
      
      // Plot area with a left margin for y-axis labels
      const LEFT_MARGIN = 24;      // space for labels/ticks
      const RIGHT_MARGIN = 4;
      const PLOT_WIDTH = width - LEFT_MARGIN - RIGHT_MARGIN;
      
      // Scaler using the fixed domain; clamps to SVG bounds
      function scaleYFixed(v) {
        const t = (Number(v) - AXIS_MIN) / (AXIS_MAX - AXIS_MIN); // normalize 0..1
        const y = height - (t * height);                          // flip for SVG y
        return Math.max(0, Math.min(height, y));                  // clamp
      }
      
      // Build sparkline polyline points (x maps into the plot area)
      let points = "";
      if (series.length > 1) {
        points = series.map((v, i) => {
          const t = (series.length - 1) === 0 ? 0 : (i / (series.length - 1));
          const x = LEFT_MARGIN + t * PLOT_WIDTH;
          const y = scaleYFixed(v);
          return `${x},${y}`;
        }).join(" ");
      }
      
      // Axis ticks at fixed feet values
      const ticks = [0, 5, 10, 15].map(ft => ({
        ft,
        y: scaleYFixed(ft)
      }));
      
      // ✅ Build the row HTML inside a template string (no overlays yet)
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${site.SiteName}</td>
        <td>${site.SiteCode}</td>
        <td>${displayValue}</td>
        <td style="white-space: pre;">${site.Trend}</td>
        <td>
          <svg width="${width}" height="${height}">
            <!-- Left y-axis line -->
            <line x1="${LEFT_MARGIN}" y1="0" x2="${LEFT_MARGIN}" y2="${height}"
                  stroke="#999" stroke-width="0.5"></line>
      
            <!-- Y-axis ticks and labels -->
            ${ticks.map(t => `
              <line x1="${LEFT_MARGIN - 4}" y1="${t.y}" x2="${LEFT_MARGIN}" y2="${t.y}"
                    stroke="#999" stroke-width="0.5"></line>
              <text x="${LEFT_MARGIN - 6}" y="${t.y + 3}" text-anchor="end"
                    font-size="9" fill="#666">${t.ft}</text>
            `).join('')}
      
            <!-- Optional: faint grid lines across plot area -->
            ${ticks.map(t => `
              <line x1="${LEFT_MARGIN}" y1="${t.y}" x2="${width - RIGHT_MARGIN}" y2="${t.y}"
                    stroke="#eee" stroke-width="0.5"></line>
            `).join('')}
      
            <!-- Sparkline on fixed axis -->
            ${points ? `
              <polyline fill="none" stroke="#0074d9" stroke-width="2"
                        points="${points}"></polyline>
            ` : `
              <!-- If no history, draw a small placeholder baseline at current value -->
              ${site.Value != null && !Number.isNaN(Number(site.Value)) ? `
                <line x1="${LEFT_MARGIN}" y1="${scaleYFixed(site.Value)}"
                      x2="${width - RIGHT_MARGIN}" y2="${scaleYFixed(site.Value)}"
                      stroke="#0074d9" stroke-width="1"></line>
              ` : ``}
            `}
          </svg>
        </td>
      
        <!-- Static columns -->
        <td>${site.Kona1Max ?? ""}</td>
        <td>${site.Kona2Max ?? ""}</td>
        <td>${site.MinorFlood ?? ""}</td>
        <td>${site.MajorFlood ?? ""}</td>
        <td>${statusInfo.icon} ${status}</td>
        <td>${toHawaiiTime(site.Timestamp)}</td>
        <td>
          map.html?lat=${site.Latitude}&lon=${site.Longitude}&name=${encodeURIComponent(site.SiteName)}View</a>
        </td>
      `;
      tbody.appendChild(row);      
    });
  });

})
.catch(err => {
  document.getElementById("updated").textContent =
    "Error loading data: " + err;
});
</script>
</body>
</html>
