  <script>
  // Determine island from SiteName
  function getIsland(name) {
    name = name.toLowerCase();
    if (name.includes("molokai")) return "Molokai";
    if (name.includes("maui")) return "Maui";
    if (name.includes("hawaii")) return "Hawaii";
    if (name.includes("oahu")) return "Oahu";
    if (name.includes("kauai")) return "Kauai";
    return "Other";
  }

  // Convert UTC timestamp → Hawaii Standard Time (UTC-10)
  function toHawaiiTime(utcString) {
    const utcDate = new Date(utcString);
    return utcDate.toLocaleString("en-US", {
      timeZone: "Pacific/Honolulu",
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  }

  // Compute gage height trend over last 3 hours
  function getTrendArrow(trend) {
    switch (trend) {
      case "Rising":  return "↑";
      case "Falling": return "↓";
      case "Steady":  return "--";
      default:        return "•"; // for N/A
    }
  }

  // Generate sparkline chart
  function makeSparkline(values, width = 100, height = 20) {
    if (!values || values.length === 0) return "";
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    return values
      .map((v, i) => {
        const x = (i / (values.length - 1)) * width;
        const y = height - ((v - min) / range) * height;
        return `${x},${y}`;
      })
      .join(" ");
  }

  // --- CSV → thresholds map (reads inline CSV) ----------------------------
  async function loadLookupTable() {
    const inlineEl = document.getElementById("lookup-table-csv");
    const csvText = inlineEl ? inlineEl.textContent.trim() : "";
    const rows = parseCSV(csvText);
    const map = {};
    rows.forEach(r => {
      const id = (r.stationID || "").trim();
      if (!id) return;
      map[id] = {
        nearValue:   numOrNull(r.nearValue),
        nearStatus:  strOrNull(r.nearStatus),
        firstValue:  numOrNull(r.firstValue),
        firstStatus: strOrNull(r.firstStatus),
        secondValue: numOrNull(r.secondValue),
        secondStatus:strOrNull(r.secondStatus),
        thirdValue:  numOrNull(r.thirdValue),
        thirdStatus: strOrNull(r.thirdStatus),
        maxValue:    numOrNull(r.maxValue),
        maxStatus:   strOrNull(r.maxStatus)
      };
    });
    return map;
  }

  function parseCSV(text) {
    if (!text) return [];
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    const header = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).map(line => {
      const cols = line.split(",").map(c => c.trim());
      const obj = {};
      header.forEach((h, i) => obj[h] = cols[i] ?? "");
      return obj;
    });
  }
  const numOrNull = v => (v === undefined || v === null || v === "" ? null : Number(v));
  const strOrNull = v => (v === undefined || v === null || v === "" ? null : v);

  // --- NEW computeStatus per your logic -----------------------------------
  // Returns { label, severity } where severity drives the icon color.
  function computeStatus(value, siteCode, thresholdsByStation) {
    const t = thresholdsByStation[siteCode];

    // If no row or nearValue is null → "No Threshold" (black)
    if (!t || t.nearValue == null) {
      return { label: "No Threshold", severity: "black" };
    }

    const v = Number(value);
    const {
      nearValue,  nearStatus,
      firstValue, firstStatus,
      secondValue,secondStatus,
      thirdValue, thirdStatus,
      maxValue,   maxStatus
    } = t;

    // Below nearValue → Normal (green)
    if (v < nearValue) {
      return { label: "Normal", severity: "green" };
    }

    // [nearValue, firstValue) → nearStatus (yellow)
    if (v >= nearValue && (firstValue == null || v < firstValue)) {
      return { label: nearStatus ?? "Near", severity: "yellow" };
    }

    // [firstValue, secondValue) → firstStatus (orange)
    if (firstValue != null && v >= firstValue && (secondValue == null || v < secondValue)) {
      return { label: firstStatus ?? "First", severity: "orange" };
    }

    // [secondValue, thirdValue) → secondStatus (orange)
    if (secondValue != null && v >= secondValue && (thirdValue == null || v < thirdValue)) {
      return { label: secondStatus ?? "Second", severity: "orange" };
    }

    // [thirdValue, maxValue) → thirdStatus (red)
    if (thirdValue != null && v >= thirdValue && (maxValue == null || v < maxValue)) {
      return { label: thirdStatus ?? "Third", severity: "red" };
    }

    // ≥ maxValue → maxStatus (red)
    if (maxValue != null && v >= maxValue) {
      return { label: maxStatus ?? "Max", severity: "red" };
    }

    // Fallback
    return { label: nearStatus ?? "Near", severity: "yellow" };
  }

  // --- NEW getStatusInfo (severity → icon color) --------------------------
  function getStatusInfo(severity) {
    switch (severity) {
      case "green":  return { icon: "🟢", cls: "" };
      case "yellow": return { icon: "🟡", cls: "" };
      case "orange": return { icon: "🟠", cls: "" };
      case "red":    return { icon: "🔴", cls: "" };
      case "black":  return { icon: "⚫", cls: "" };
      case "out":    return { icon: "⚪", cls: "" }; // Out of Date
      default:       return { icon: "⚫", cls: "" };
    }
  }

  // Load GitHub workflow timestamp (unchanged)
  let buildTimeHST = "loading...";
  fetch("buildinfo.json?cache=" + Date.now())
    .then(r => r.json())
    .then(info => {
      buildTimeHST = toHawaiiTime(info.buildTime);
      document.getElementById("updated").textContent =
        "Updated (HST): " + buildTimeHST;
    })
    .catch(err => {
      document.getElementById("updated").textContent =
        "Updated: error loading timestamp";
    });

  let historyData = {};
  let thresholdsByStation = {};

  // Include the inline lookup loader
  Promise.all([
    fetch("history24.json?cache=" + Date.now()).then(r => r.json()),
    fetch("latest_with_trend.json?cache=" + Date.now()).then(r => r.json()),
    loadLookupTable()
  ])
  .then(([history24, data, lookup]) => {
    historyData = history24;
    thresholdsByStation = lookup;

    const now = Date.now();
    const twentyFourHours = 24 * 60 * 60 * 1000;

    const tbody = document.querySelector("#gage-table tbody");
    tbody.innerHTML = "";

    // Group by island
    const groups = {};
    data.forEach(site => {
      const island = getIsland(site.SiteName);
      if (!groups[island]) groups[island] = [];
      groups[island].push(site);
    });

    // Render each island group
    Object.keys(groups).forEach(island => {
      const headerRow = document.createElement("tr");
      headerRow.innerHTML = `
        <td colspan="12" style="
          background:#004578;
          color:white;
          font-weight:bold;
          font-size:18px;
          text-align:left;
        ">${island}</td>
      `;
      tbody.appendChild(headerRow);

      groups[island].forEach(site => {
        const siteTime = new Date(site.Timestamp).getTime();
        const age = now - siteTime;

        let statusObj;
        let displayValue = site.Value;

        if (age > twentyFourHours) {
          // Preserve Out-of-Date behavior
          statusObj = { label: "Out of Date", severity: "out" };
          displayValue = "n/a";
        } else {
          // Ensure we match the CSV’s stationID key
          const siteId = String(site.SiteCode ?? "");
          statusObj = computeStatus(site.Value, siteId, thresholdsByStation);
        }

        const statusInfo = getStatusInfo(statusObj.severity);

        // 24‑hour sparkline
        const historyValues = (historyData[site.SiteCode] || []).map(v => v.Value);
        const spark = makeSparkline(historyValues);

        // Build row safely (so a single bad record doesn't kill the table)
        try {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${site.SiteName}</td>
            <td>${site.SiteCode}</td>
            <td>${displayValue}</td>
            <td style="white-space: pre;">${site.Trend}</td>
            <td>
              <svg width="100" height="20">
                <polyline fill="none" stroke="#0074d9" stroke-width="2"
                  points="${spark}">
                </polyline>
              </svg>
            </td>
            <td>${site.Kona1Max ?? ""}</td>
            <td>${site.Kona2Max ?? ""}</td>
            <td>${site.MinorFlood ?? ""}</td>
            <td>${site.MajorFlood ?? ""}</td>
            <td style="text-align:left;">${statusInfo.icon} ${statusObj.label}</td>
            <td>${toHawaiiTime(site.Timestamp)}</td>
            <td>
              <a href="map.html?lat=${site.Latitude}&lon=${site.Longitude}&name=${encodeURIComponent(site.SiteName)}"
          </td>
          `;
          tbody.appendChild(row);
        } catch (e) {
          console.error("Row build error for", site.SiteCode, site.SiteName, e);
        }
      });
    });
  })
  .catch(err => {
    console.error(err);
    document.getElementById("updated").textContent =
      "Error loading data: " + err;
  });
  </script>
