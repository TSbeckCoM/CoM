name: Update Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push with fine-grained PAT instead of GITHUB_TOKEN:
          persist-credentials: false

      - name: Configure Git bot identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run USGS script
        shell: pwsh
        run: ./StreamGageUpdate.ps1

      - name: Compute Trend
        shell: pwsh
        run: ./compute-trend.ps1

      - name: Write build timestamp
        shell: pwsh
        run: |
          $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = @{ buildTime = $ts } | ConvertTo-Json
          Set-Content -Path buildinfo.json -Value $json -Encoding UTF8
    
      - name: Commit & Push (optional PAT)
        shell: pwsh
        env:
          PAT: ${{ secrets.streamGageUpdate }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add latest.json latest_with_trend.json history.json buildinfo.json history24.json

          # Commit only if something is staged
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update dashboard"

            $repo  = "${{ github.repository }}"
            $event = "${{ github.event_name }}"
            Write-Host "Event: $event  Repo: $repo"

            # Clear cached credentials/headers so our chosen auth applies
            git config --system --unset credential.helper 2>$null
            git config --global --unset credential.helper 2>$null
            git config --local  --unset credential.helper 2>$null
            git config --local  --unset-all http.https://github.com/.extraheader 2>$null

            # Prefer PAT if present (recommended for cron/dispatch)
            $pat = $env:PAT
            if ($pat) { $pat = $pat.Trim() }
            if ($pat) {
              Write-Host "Using fine-grained PAT to push."
              git remote set-url origin "https://x-access-token:$pat@github.com/$repo.git"
            } else {
              Write-Host "PAT not present; using GITHUB_TOKEN to push."
              $gtok = $env:GITHUB_TOKEN
              if (-not $gtok) {
                Write-Error "GITHUB_TOKEN not available; cannot push."
                exit 1
              }
              git remote set-url origin "https://x-access-token:$gtok@github.com/$repo.git"
             }


            # Show remotes and test connectivity before pushing
            Write-Host "Effective remotes:"
            git remote -v
            Write-Host "Testing remote access via 'git ls-remote'…"
            git ls-remote origin HEAD
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Remote test failed (likely auth issue). Aborting before push."
              exit 1
            }

            # Push once
            git push origin HEAD:main --verbose
          } else {
            Write-Host "No changes to commit."
          }

