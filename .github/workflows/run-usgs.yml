name: Update Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push with fine-grained PAT instead of GITHUB_TOKEN:
          persist-credentials: false

      - name: Configure Git bot identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run USGS script
        shell: pwsh
        run: ./StreamGageUpdate.ps1

      - name: Compute Trend
        shell: pwsh
        run: ./compute-trend.ps1

      - name: Write build timestamp
        shell: pwsh
        run: |
          $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = @{ buildTime = $ts } | ConvertTo-Json
          Set-Content -Path buildinfo.json -Value $json -Encoding UTF8
    
      - name: Commit & Push (optional PAT)
        shell: pwsh
        env:
          PAT: ${{ secrets.streamGageUpdate }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add latest.json latest_with_trend.json history.json buildinfo.json history24.json

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update dashboard"

            $repo = "${{ github.repository }}"
            if ($env:PAT) {
              Write-Host "Using fine-grained PAT for push."
              git remote set-url origin "https://x-access-token:$($env:PAT)@github.com/$repo.git"
            } else {
              Write-Host "Using default GITHUB_TOKEN for push."
            }

            git push origin HEAD:main
          } else {
            Write-Host "No changes to commit."
          }

